name: Build Xbox XBE

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/xboxdev/nxdk:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Clone mbedtls
        run: git clone --depth 1 --branch v2.28.8 https://github.com mbedtls

      - name: Compile XBE
        run: export PATH="/usr/src/nxdk/bin:$PATH" && make -C client

      - name: Upload XBE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dominos-Xbox-App
          path: |
            client/**/*.xbe
            client/**/vegur-regular.ttf
            client/**/cacert.pem
            client/**/logo_s.png
            client/**/logo_l.png
