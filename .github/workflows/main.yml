name: Build Xbox XBE

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/xboxdev/nxdk:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout mbedtls
        uses: actions/checkout@v4
        with:
          repository: Mbed-TLS/mbedtls
          ref: v3.6.2
          path: mbedtls

      - name: Compile XBE
        run: |
          echo "#define _Check_return_" > mbedtls/include/sal.h
          export PATH="/usr/src/nxdk/bin:$PATH"
          make -C client

      - name: Upload XBE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dominos-Xbox-App
          path: |
            client/**/*.xbe
            client/**/vegur-regular.ttf
            client/**/cacert.pem
            client/**/logo_s.png
            client/**/logo_l.png
