name: Build Xbox XBE

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/xboxdev/nxdk:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout mbedtls v3.6.2
        uses: actions/checkout@v4
        with:
          repository: Mbed-TLS/mbedtls
          ref: v3.6.2
          path: mbedtls

      - name: Create stub sal.h and configure mbedtls for NXDK
        run: |
          mkdir -p XBOX/client
          cat << 'EOF' > XBOX/client/sal.h
          #pragma once
          #define _In_
          #define _In_opt_
          #define _Out_
          #define _Out_opt_
          #define _Inout_
          #define _Inout_opt_
          #define _Ret_maybenull_
          EOF
          cp XBOX/client/sal.h ./sal.h

          cat << 'EOF' >> mbedtls/include/mbedtls/mbedtls_config.h
          #define MBEDTLS_NO_PLATFORM_ENTROPY
          #define MBEDTLS_ENTROPY_HARDWARE_ALT
          EOF

          cat << 'EOF' > XBOX/client/xbox_entropy.c
          #include <stddef.h>
          #include <stdint.h>

          int mbedtls_hardware_poll(void *data, unsigned char *output, size_t len, size_t *olen) {
              (void)data;
              for (size_t i = 0; i < len; i++) {
                  uint32_t lo, hi;
                  __asm__ __volatile__("rdtsc" : "=a"(lo), "=d"(hi));
                  for (volatile int j = 0; j < (lo & 0xF) + 1; j++) {}
                  __asm__ __volatile__("rdtsc" : "=a"(lo), "=d"(hi));
                  output[i] = (unsigned char)(lo ^ (lo >> 8));
              }
              *olen = len;
              return 0;
          }
          EOF

          MAKEFILE_PATH=$(find . -maxdepth 3 -name "Makefile" | head -n 1)
          echo "Found Makefile at: $MAKEFILE_PATH"
          if [ -n "$MAKEFILE_PATH" ] && grep -q "^SRCS" "$MAKEFILE_PATH"; then
            sed -i 's|^SRCS[[:space:]]*=|SRCS = XBOX/client/xbox_entropy.c |' "$MAKEFILE_PATH"
          fi

      - name: Compile XBE
        run: |
          MAKEFILE_DIR=$(dirname "$(find . -maxdepth 3 -name "Makefile" | head -n 1)")
          make -C "$MAKEFILE_DIR"

      - name: Upload XBE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dominos-app-for-XBOX
          path: "**/*.xbe"
