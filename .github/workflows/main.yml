name: Build Xbox XBE

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/xboxdev/nxdk:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout mbedtls v3.6.2
        uses: actions/checkout@v4
        with:
          repository: Mbed-TLS/mbedtls
          ref: v3.6.2
          path: mbedtls

      - name: Create stub sal.h and configure mbedtls for NXDK
        run: |
          # Create minimal sal.h for MSVC/Windows SAL annotations if referenced
          mkdir -p XBOX/client/include
          cat << 'EOF' > XBOX/client/include/sal.h
          #pragma once
          #define _In_
          #define _In_opt_
          #define _Out_
          #define _Out_opt_
          #define _Inout_
          #define _Inout_opt_
          #define _Ret_maybenull_
          EOF

          # Disable Windows bcrypt.h entropy and enable custom hardware entropy
          cat << 'EOF' >> mbedtls/include/mbedtls/mbedtls_config.h
          #define MBEDTLS_NO_PLATFORM_ENTROPY
          #define MBEDTLS_ENTROPY_HARDWARE_ALT
          EOF

          # Create Xbox hardware entropy implementation using CPU cycle counter jitter
          cat << 'EOF' > XBOX/client/xbox_entropy.c
          #include <stddef.h>
          #include <stdint.h>

          int mbedtls_hardware_poll(void *data, unsigned char *output, size_t len, size_t *olen) {
              (void)data;
              for (size_t i = 0; i < len; i++) {
                  uint32_t lo, hi;
                  __asm__ __volatile__("rdtsc" : "=a"(lo), "=d"(hi));
                  for (volatile int j = 0; j < (lo & 0xF) + 1; j++) {}
                  __asm__ __volatile__("rdtsc" : "=a"(lo), "=d"(hi));
                  output[i] = (unsigned char)(lo ^ (lo >> 8));
              }
              *olen = len;
              return 0;
          }
          EOF

          # Ensure xbox_entropy.c is compiled if SRCS is listed explicitly in Makefile
          if grep -q "^SRCS" XBOX/client/Makefile; then
            sed -i 's|^SRCS[[:space:]]*=|SRCS = xbox_entropy.c |' XBOX/client/Makefile
          fi

      - name: Compile XBE
        run: make -C XBOX/client

      - name: Upload XBE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dominos-app-for-XBOX
          path: XBOX/client/*.xbe
