name: Build Xbox XBE

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/xboxdev/nxdk:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout mbedtls v3.6.2
        uses: actions/checkout@v4
        with:
          repository: Mbed-TLS/mbedtls
          ref: v3.6.2
          path: mbedtls

      - name: Create stub headers and configure mbedtls for NXDK
        run: |
          mkdir -p mbedtls/include/mbedtls

          cat << 'EOF' > mbedtls/include/sal.h
          #pragma once
          #define _Check_return_
          EOF

          cat << 'EOF' > mbedtls/include/winsock2.h
          #pragma once
          #include <lwip/inet.h>
          EOF

          cat << 'EOF' > mbedtls/include/ws2tcpip.h
          #pragma once
          #include <lwip/inet.h>
          #ifndef inet_pton
          #define inet_pton lwip_inet_pton
          #endif
          EOF

          sed -i 's|^#pragma comment(lib, "ws2_32.lib")|//#pragma comment(lib, "ws2_32.lib")|' mbedtls/library/*.c

          sed -i 's|^#define MBEDTLS_TIMING_C|//#define MBEDTLS_TIMING_C|' mbedtls/include/mbedtls/mbedtls_config.h
          sed -i 's|^#define MBEDTLS_NET_C|//#define MBEDTLS_NET_C|' mbedtls/include/mbedtls/mbedtls_config.h
          sed -i 's|^#define MBEDTLS_FS_IO|//#define MBEDTLS_FS_IO|' mbedtls/include/mbedtls/mbedtls_config.h
          sed -i 's|^#define MBEDTLS_ENTROPY_PLATFORM|//#define MBEDTLS_ENTROPY_PLATFORM|' mbedtls/include/mbedtls/mbedtls_config.h
          sed -i 's|^#define MBEDTLS_PSA_ITS_FILE_C|//#define MBEDTLS_PSA_ITS_FILE_C|' mbedtls/include/mbedtls/mbedtls_config.h
          sed -i 's|^#define MBEDTLS_PSA_CRYPTO_STORAGE_C|//#define MBEDTLS_PSA_CRYPTO_STORAGE_C|' mbedtls/include/mbedtls/mbedtls_config.h
          sed -i 's|^//#define MBEDTLS_NO_PLATFORM_ENTROPY|#define MBEDTLS_NO_PLATFORM_ENTROPY|' mbedtls/include/mbedtls/mbedtls_config.h

      - name: Compile XBE
        run: |
          export NXDK_DIR=/usr/src/nxdk
          export PATH="$NXDK_DIR/bin:$PATH"
          make -C ./client

      - name: Upload XBE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xbox-xbe
          path: "**/*.xbe"
